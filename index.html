<style>/* ============================================================
   BetterConnect — design system
   Gmail-inspired: clean white/grey surfaces, Google blue,
   crisp hairline borders, Roboto. Minimal, neutral, familiar.
   ============================================================ */

:root{
  /* Brand (Google blue) */
  --brand:#1A73E8;
  --brand-d:#1557B0;        /* darker */
  --brand-ink:#174EA6;      /* text on light */
  --brand-soft:#E8F0FE;     /* tint surface */
  --brand-soft-2:#D2E3FC;

  /* Surfaces */
  --bg:#F6F8FC;             /* phone screen background (cool grey) */
  --card:#FFFFFF;
  --card-2:#F8FAFD;

  /* Ink (Google greys) */
  --ink:#202124;
  --ink-2:#3C4043;
  --ink-3:#5F6368;
  --ink-4:#80868B;

  /* Borders */
  --line:#E8EAED;
  --line-2:#DADCE0;         /* Google's signature hairline */

  /* Semantic fee states (Google green/amber/red) */
  --paid:#1E8E3E;     --paid-bg:#E6F4EA;   --paid-br:#CEEAD6;
  --due:#B06000;      --due-bg:#FEF7E0;    --due-br:#FEEFC3;
  --over:#D93025;     --over-bg:#FCE8E6;   --over-br:#F6CBC7;

  /* WhatsApp */
  --wa:#1FA855;  --wa-d:#0E7B43;  --wa-bg:#E7F8EE;

  /* Radii & shadow */
  --r-card:14px;
  --r-btn:24px;
  --r-pill:999px;
  --shadow-card:0 1px 2px rgba(60,64,67,.06), 0 1px 3px rgba(60,64,67,.10);
  --shadow-pop:0 12px 40px rgba(60,64,67,.22);
  --shadow-btn:0 1px 2px rgba(26,115,232,.3), 0 1px 3px rgba(26,115,232,.15);

  --font:'Roboto', system-ui, sans-serif;
  --mono:'Roboto Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{height:100%;}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 700px at 50% -10%, #EEF1F6 0%, #E4E7EC 60%, #DDE1E7 100%);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
}

/* ---------- Stage / phone scaler ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#scaler{transform-origin:center center;}

/* ---------- Phone shell ---------- */
.phone{
  width:392px;height:812px;border-radius:46px;
  background:#15140F;padding:11px;
  box-shadow:
    0 50px 100px -20px rgba(20,18,14,.55),
    0 0 0 2px rgba(255,255,255,.04) inset;
  position:relative;
}
.phone-screen{
  width:100%;height:100%;border-radius:36px;overflow:hidden;
  background:var(--bg);position:relative;
  display:flex;flex-direction:column;
}

/* status bar */
.statusbar{
  height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;position:relative;z-index:5;
  font-variant-numeric:tabular-nums;
}
.statusbar.on-brand{color:#fff;}
.statusbar.on-paper{color:var(--ink);}
.statusbar .clock{font-size:15px;font-weight:700;letter-spacing:.2px;}
.statusbar .si{display:flex;align-items:center;gap:6px;}
.notch{
  position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:104px;height:26px;border-radius:999px;background:#15140F;
}

/* screen body (scrolls) */
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.body::-webkit-scrollbar{width:0;display:none;}

/* home indicator */
.home-ind{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;background:transparent;}
.home-ind::after{content:'';width:128px;height:5px;border-radius:999px;background:var(--ink);opacity:.22;}
.home-ind.on-brand::after{background:#fff;opacity:.5;}

/* screen transition */
.screen-enter{animation:screenIn .28s cubic-bezier(.22,.61,.36,1);}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ============================================================
   App bars
   ============================================================ */
.appbar{
  display:flex;align-items:center;gap:10px;padding:8px 16px 14px;
  background:var(--bg);
}
.appbar.brand{background:var(--brand);}
.appbar .ab-back{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.04);color:var(--ink);
}
.appbar.brand .ab-back{background:rgba(255,255,255,.16);color:#fff;}
.appbar .ab-title{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--ink);}
.appbar.brand .ab-title{color:#fff;}
.appbar .ab-sub{font-size:13px;color:var(--ink-3);margin-top:1px;}
.appbar.brand .ab-sub{color:rgba(255,255,255,.78);}
.ab-spacer{flex:1;}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  font-family:var(--font);border:none;cursor:pointer;border-radius:var(--r-btn);
  font-weight:800;font-size:16px;letter-spacing:-.2px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:0 20px;height:54px;transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-block{width:100%;}
.btn-pri{background:var(--brand);color:#fff;box-shadow:var(--shadow-btn);}
.btn-pri:active{filter:brightness(1.05);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 6px 16px rgba(31,168,85,.3);}
.btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line-2);}
.btn-soft{background:var(--brand-soft);color:var(--brand-ink);}
.btn-lg{height:58px;font-size:17px;}
.btn-sm{height:42px;font-size:14px;padding:0 14px;border-radius:11px;}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none;}
/* aliases used in classroom */
.btn-primary{font-family:var(--font);border:none;cursor:pointer;border-radius:var(--r-btn);font-weight:800;font-size:15px;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;padding:0 20px;height:52px;width:100%;background:var(--brand);color:#fff;box-shadow:var(--shadow-btn);transition:transform .08s ease,filter .15s ease;}
.btn-primary:active{transform:scale(.97);filter:brightness(1.05);}
.btn-primary:disabled{opacity:.45;pointer-events:none;box-shadow:none;}
.btn-secondary{font-family:var(--font);border:1.5px solid var(--line-2);cursor:pointer;border-radius:var(--r-btn);font-weight:700;font-size:15px;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;padding:0 20px;height:52px;width:100%;background:var(--card);color:var(--ink);transition:transform .08s ease;}
.btn-secondary:active{transform:scale(.97);}

/* sticky bottom action area */
.action-bar{
  position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 72%, rgba(244,241,234,0));
  display:flex;flex-direction:column;gap:9px;
}
.action-bar.on-card{background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0));}

/* ============================================================
   Cards, sections, rows
   ============================================================ */
.pad{padding:0 16px;}
.section-label{
  font-size:13px;font-weight:600;color:var(--ink-3);
  letter-spacing:.01em;padding:10px 18px 9px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);margin:0 16px 14px;overflow:hidden;
}
.card-pad{padding:18px;}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row-label{font-size:14px;color:var(--ink-3);font-weight:600;}
.row-value{font-size:15px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;}

/* avatar */
.avatar{
  width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:#fff;letter-spacing:-.3px;
}

/* student list row */
.slist{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card);margin:0 16px 14px;overflow:hidden;}
.srow{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card);transition:background .12s;}
.srow:last-child{border-bottom:none;}
.srow:active{background:var(--card-2);}
.srow .nm{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
.srow .mt{font-size:13px;color:var(--ink-3);margin-top:2px;}

/* ============================================================
   Pills / status
   ============================================================ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;
  padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap;letter-spacing:-.1px;}
.pill-paid{background:var(--paid-bg);color:var(--paid);}
.pill-due{background:var(--due-bg);color:var(--due);}
.pill-over{background:var(--over-bg);color:var(--over);}
.pill-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-3);
  background:var(--card-2);border:1px solid var(--line);padding:4px 9px;border-radius:8px;}

/* ============================================================
   Amount typography
   ============================================================ */
.amt{font-variant-numeric:tabular-nums;letter-spacing:-.5px;font-weight:800;}
.rupee{font-weight:700;opacity:.7;}

/* ============================================================
   Progress
   ============================================================ */
.prog-track{height:9px;border-radius:999px;background:var(--line-2);overflow:hidden;}
.prog-fill{height:100%;border-radius:999px;background:var(--paid);transition:width .5s cubic-bezier(.22,.61,.36,1);}

/* onboarding stepper */
.steps{display:flex;align-items:center;gap:7px;padding:6px 16px 4px;}
.step-bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;}
.step-bar.done{background:#fff;}
.step-bar.cur span{display:block;height:100%;width:55%;background:#fff;border-radius:999px;}

/* ============================================================
   Inputs
   ============================================================ */
.field{padding:0 16px 16px;}
.field > label{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:7px;letter-spacing:-.1px;}
.input{
  width:100%;height:54px;border:1.5px solid var(--line-2);border-radius:14px;
  background:var(--card);padding:0 16px;font-family:var(--font);font-size:17px;font-weight:600;color:var(--ink);
  outline:none;transition:border-color .15s, box-shadow .15s;
}
.input::placeholder{color:var(--ink-4);font-weight:500;}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
textarea.input{height:auto;padding:14px 16px;line-height:1.5;resize:none;}
.input-hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.5;}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23736E65' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 16px center;padding-right:44px;}

/* big choice option (radio cards) */
.opt{
  display:flex;align-items:center;gap:14px;padding:16px;border:2px solid var(--line-2);
  border-radius:16px;background:var(--card);cursor:pointer;margin:0 16px 12px;transition:.15s;
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);}
.opt .opt-radio{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;}
.opt.sel .opt-radio{border-color:var(--brand);}
.opt.sel .opt-radio::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--brand);}
.opt .opt-ico{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);}
.opt-title{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
.opt-sub{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.4;}

/* OTP boxes */
.otp{display:flex;gap:10px;justify-content:center;padding:8px 16px 4px;}
.otp-box{width:52px;height:62px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--ink);}
.otp-box.filled{border-color:var(--brand);background:var(--brand-soft);}
.otp-box.cur{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}

/* day chips */
.daychips{display:flex;gap:7px;flex-wrap:wrap;}
.daychip{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink-3);cursor:pointer;}
.daychip.on{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ============================================================
   Bottom tab nav
   ============================================================ */
.tabbar{
  display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:8px 6px 4px;flex:0 0 auto;
}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;font-family:var(--font);}
.tab .tab-ico{color:var(--ink-4);transition:color .15s;}
.tab .tab-txt{font-size:11px;font-weight:700;color:var(--ink-4);}
.tab.on .tab-ico{color:var(--brand);}
.tab.on .tab-txt{color:var(--brand);}
.tab .tab-pill{padding:4px 0;width:100%;display:flex;justify-content:center;border-radius:10px;}
.tab.on .tab-pill{background:var(--brand-soft);}

/* ============================================================
   WhatsApp message preview
   ============================================================ */
.wa-screen{background:#E5DDD3;border-radius:16px;padding:14px;border:1px solid var(--line-2);margin:0 16px 14px;}
.wa-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.wa-bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:14px;color:#111;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.08);max-width:90%;}
.wa-bubble .wa-link{display:block;margin-top:9px;padding:10px 12px;background:#F2F7FF;border:1px solid #CFE0FB;border-radius:10px;color:var(--brand);font-weight:800;font-size:13px;font-family:var(--mono);}
.wa-time{font-size:10.5px;color:#888;text-align:right;margin-top:5px;}

/* receipt / link mono */
.mono{font-family:var(--mono);}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow-pop);z-index:50;
  display:flex;align-items:center;gap:9px;white-space:nowrap;animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* confetti-free success check */
.success-ring{width:96px;height:96px;border-radius:50%;background:var(--paid-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  animation:pop .4s cubic-bezier(.2,.8,.3,1.4);}
@keyframes pop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* hero balance card (dashboard) */
.hero{margin:0 16px 16px;border-radius:16px;background:linear-gradient(135deg,#1a73e8 0%,#1565d8 55%,var(--brand-d) 100%);
  padding:20px;color:#fff;box-shadow:0 1px 3px rgba(26,115,232,.35);position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none;}

/* stat triplet */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:0 16px 16px;}
.tri-cell{background:var(--card);padding:14px 10px;text-align:center;}
.tri-cell .n{font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.tri-cell .l{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-top:3px;}

/* segmented */
.seg{display:flex;background:var(--brand-soft);border-radius:13px;padding:4px;margin:0 16px 14px;gap:4px;}
.seg button{flex:1;border:none;background:none;font-family:var(--font);font-size:13.5px;font-weight:800;color:var(--brand-ink);
  padding:9px 4px;border-radius:10px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.08);}

/* mini bar chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;}
.bar-track{flex:1;width:100%;display:flex;align-items:flex-end;}
.bar-fill{width:100%;border-radius:8px 8px 4px 4px;background:var(--brand-soft-2);}
.bar-fill.hot{background:var(--brand);}
.bar-x{font-size:11px;font-weight:700;color:var(--ink-3);}

/* helper text blocks */
.callout{display:flex;gap:11px;align-items:flex-start;margin:0 16px 14px;padding:13px 15px;border-radius:14px;font-size:13.5px;line-height:1.5;}
.callout.info{background:var(--brand-soft);color:var(--brand-ink);}
.callout.warn{background:var(--due-bg);color:var(--due);}
.callout strong{font-weight:800;}

.center-screen{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:24px;}
.grow{flex:1;min-height:14px;}
.muted{color:var(--ink-3);}
.tabnums{font-variant-numeric:tabular-nums;}
</style>
</head>

<div id="stage"></div>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#1A73E8"/>
    <rect x="34" y="22" width="32" height="56" rx="7" fill="#FFFFFF"/>
    <path d="M44 40h12M44 47h12M44 54h7" stroke="#1A73E8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="50" cy="64" r="3" fill="#1E8E3E"/>
  </svg>
</template>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

/* parse start/end minutes from batch time string e.g. "5:00–6:00 PM" */
function parseStartMin(t) {

  if (!m) return 0;
